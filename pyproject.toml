[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-eater"
version = "0.1.0"
description = "A stress-testing & benchmarking toolkit for LLM token throughput, context window limits, and API rate analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Remon", email = "monneverera@users.noreply.github.com" },
    { name = "Orion (Lumen Lab)" },
]
keywords = ["llm", "benchmark", "tokens", "stress-test", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "tomli>=2.0; python_version < '3.11'",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
html = [
    "plotly>=5.22",
]

[project.scripts]
token-eater = "token_eater.cli:app"

[project.urls]
Homepage = "https://github.com/monneverera/token-eater"
Repository = "https://github.com/monneverera/token-eater"
Issues = "https://github.com/monneverera/token-eater/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
